name: Build Qt

on:
  push:
    branches: [qt]
  pull_request:
    branches: [qt]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          qt_archives: "qtbase qtdeclarative icu"
        - os: macos-latest
          qt_archives: "qtbase qtdeclarative"
        - os: windows-latest
          qt_archives: "qtbase qtdeclarative"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjack-jackd2-dev libasound2-dev

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          archives: ${{ matrix.qt_archives }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSINGULARITY_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release --target ExampleEffect_APP ExampleEffect_VST3

